# Live-run model patch for profile launches (`pnpm dsh --profile headless
# --patch dsh-openrouter.patch.yml "task"`): routes the turn through the
# OpenRouter completions API instead of the dead DEEPSEEK_API_KEY default.
# Same rows and guards as the devBIM site overlay
# (packages/bundle/web-app/devbim.patch.yml); DEV_MODELS and
# OPENROUTER_API_KEY come from root .env, which profile launches load.
# Do not add rows for anything but models here: a profile launch with this
# patch must stay a pure model-route change.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js "(() => {
      const ids = (process.env.DEV_MODELS ?? '').split(',').map((id) => id.trim()).filter(Boolean);
      if (ids.length === 0) {
        throw new Error('dsh-openrouter.patch: DEV_MODELS is empty - add DEV_MODELS=id1,id2,... to root .env.');
      }
      return {
        openrouter: {
          apiKeyEnv: 'OPENROUTER_API_KEY',
          api: 'openai-completions',
          baseURL: 'https://openrouter.ai/api/v1',
          models: ids.map((id) => ({ id })),
        },
      };
    })()"
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: openrouter
    model: !!js "(() => { const ids = (process.env.DEV_MODELS ?? '').split(',').map((id) => id.trim()).filter(Boolean); if (ids.length === 0) throw new Error('dsh-openrouter.patch: DEV_MODELS is empty - set it in root .env.'); return ids[0]; })()"
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true
