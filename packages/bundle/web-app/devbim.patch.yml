# devBIM deployment overlay for the web profile: replace the official
# DeepSeek Harness brand occupants with the devBIM identity (sidebar
# mark/name + conversation hero mark). Kept beside the dsh-web-app bundle so
# the row's package resolves from this layer's own dependencies.
# Launch: dsh web --patch packages/bundle/web-app/devbim.patch.yml

- id: ui-brand-official
  disabled: true

- insert:
    # devBIM occupants for the sidebar brand row and the blank-session hero.
    - id: ui-brand-devbim
      name: '@deepseek-ai/dsh-client-ui-brand-devbim'

    # Password gate for the public devbim.dev-bim.com deployment: an empty
    # DEVBIM_WEB_PASSWORD (Harness/.env) registers no routes, leaving the
    # process-token flow the only entry.
    - id: devbim-auth
      name: '@deepseek-ai/dsh-host-devbim-auth'
      config:
        password: !!js process.env.DEVBIM_WEB_PASSWORD ?? ''

# drawing5 подключает плагин dsh-plugin-drawing5 (он же регистрирует
# скилл drawing5-mcp и окно «Чертежи»). Строка ниже — переопределение
# строки плагина: верхнеуровневая, без insert:, тот же id: drawing5-mcp —
# задаёт деплой-адрес и токен. Вставка с тем же serverName вместо этого
# добавила бы вторую строку и откатила весь набор инструментов агента.
# Инструменты mcp__drawing5__*: list_developments, list_houses,
# list_documents, create_development, create_house, upload_pdf,
# get_document, list_sheets, search, get_sheet,
# get_sheet_images, extract_stamps, get_health.
# Токен — из launcher-окружения (Harness/.env), в конфиг не коммится.
- id: drawing5-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: drawing5
    transport: streamable-http
    url: http://127.0.0.1:8808/mcp
    headers:
      Authorization: !!js '`Bearer ${process.env.DRAWING5_KEY}`'
    toolCallTimeoutMs: 120000

# Окно «Чертежи» (модуль плагина) по умолчанию смотрит на облако и читает
# DRAWING5_API_KEY; на деплой-машине сервер и токен те же, что у
# MCP-строки выше, поэтому строка модуля переопределяется тоже.
- id: drawing5-skill
  name: dsh-plugin-drawing5
  config:
    serverUrl: http://127.0.0.1:8808
    token: !!js process.env.DRAWING5_KEY ?? ''

# dsh-plugin-smeta подключает сметный ассистент БелЕНиР (скилл smeta-mcp и
# окно «Сметы»). Сметный сервер живёт на отдельной машине за туннелем
# smeta.dev-bim.com; локального MCP-сервера на деплой-машине больше нет, поэтому
# обе строки плагина переопределяются — верхнеуровневые, без insert:, с теми
# же id: smeta-mcp и smeta-skill. Адрес берётся из SMETA_SERVER_URL
# (launcher-окружение, Harness/.env) и по умолчанию совпадает с дефолтом
# плагина. Авторизации нет. Инструменты mcp__smeta__*: search_rascenki,
# get_rascenka, calc_position, get_stats, get_health.
- id: smeta-mcp
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: smeta
    transport: streamable-http
    url: !!js (process.env.SMETA_SERVER_URL ?? "https://smeta.dev-bim.com") + "/mcp"
    toolCallTimeoutMs: 120000

- id: smeta-skill
  name: dsh-plugin-smeta
  config:
    serverUrl: !!js process.env.SMETA_SERVER_URL ?? "https://smeta.dev-bim.com"

# The public tunnel authority joins the /api Host/Origin trust fence. The
# bundle's connection row injects `webStartup`; this overlay restates the
# injection so the expression may read the invocation's `--trusted-host`
# values alongside the tunnel authority.
- id: connection
  inject: [webStartup]
  config:
    trustedHosts: !!js "['devbim.dev-bim.com', ...ctx.webStartup.trustedHosts]"
