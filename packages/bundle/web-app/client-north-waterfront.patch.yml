# Client-facing deployment overlay for north-waterfront.dev-bim.com: the
# customer site for the "Северный берег" drawings delivery. Keeps the NW
# (north-waterfront) brand and password gate, hides every team-facing surface
# (settings, plugin manager, terminal/files panels, agent-orchestration UI),
# and narrows the agent's tool set to the drawing5 tools plus read-only
# workspace access (`read`, `grep`). The model picker
# stays available but lists only the OpenRouter models named by NW_MODELS,
# plus the Z.AI coding-plan catalog when the subscription key is set.
# The permission catalog keeps only workspace-write and pins it as the
# new-session default, so the client user works inside their own workspace
# folder with no access switch.
# The preset-picker chip returns with the custom-agent builder: users compose
# their own agents from the whitelist below (persona instructions + optional
# whitelisted rows). User input reaches the Loader only as typed
# configuration values; the shipped coding presets are not declared here at
# all, and no plugin manager or settings surface is reachable.
# Session state, stored credentials, and settings live in the launcher's
# separate DSH_HOME, not in anything this layer touches.
# Launch: dsh-web-north-waterfront.cmd
#   (dsh web --port 3081 --patch packages/bundle/web-app/client-north-waterfront.patch.yml)

- id: ui-brand-official
  disabled: true

- insert:
    # north-waterfront occupants for the sidebar brand row and the blank-session hero.
    - id: ui-brand-north-waterfront
      name: '@deepseek-ai/dsh-client-ui-brand-north-waterfront'

    # Password gate: DEVBIM_WEB_PASSWORD comes from .env.north-waterfront
    # loaded by the client launcher, so the internal and client sites keep
    # different passwords. An empty value registers no routes, leaving the
    # process-token flow the only entry.
    - id: devbim-auth
      name: '@deepseek-ai/dsh-host-devbim-auth'
      config:
        password: !!js process.env.DEVBIM_WEB_PASSWORD ?? ''
        entryTitle: 'NW — вход'
        wordmarkLead: 'NW'
        wordmarkAccent: ''
        # The served index <title> (the tab title): rewritten per request by
        # the gate, because the shared built bundle keeps its bake-time title.
        indexTitle: 'NW — Северный берег'

# The client DSH_HOME stages fresh with no stored credentials: the model
# provider keys come from the launcher env (.env.north-waterfront) and the
# default model is pinned here, so no sign-in onboarding ever appears.
#
# NW_MODELS is the deployment's model allowlist: a comma-separated list of
# OpenRouter ids (from .env.north-waterfront). The `models` list REPLACES the
# installed OpenRouter catalog, so the picker and the session model catalog
# expose exactly these ids. The first entry is also the new-session default.
# An unset or empty value FAILS THE BOOT. The value reaches the process only
# through the launcher env, so emptiness means the site was started outside
# dsh-web-north-waterfront.cmd. The historical three-model fallback hid that
# misconfiguration (and its sessions ran on models the operator never chose);
# an empty `models` list must never be substituted either, because an empty
# `models` means the FULL installed catalog. Hence the loud guard below.
# Each id must appear exactly once: a duplicate invalidates every copy of the
# id. The route pins `api: openai-completions` because NW_MODELS may name ids
# the installed pi-ai catalog has not caught up with, and the OpenRouter
# catalog is not protocol-uniform (most models speak openai-completions, the
# Anthropic ones anthropic-messages), so an unlisted id has no api to inherit.
# OpenRouter serves every model through its OpenAI-compatible completions API,
# which also becomes the wire protocol of the two catalog Anthropic models.
#
# The openrouter route pins `baseURL: https://openrouter.ai/api/v1` beside the
# api pin, and the pin is load-bearing: the api pin alone is not enough for ids
# the installed pi-ai catalog lists. A listed anthropic-protocol entry carries
# baseUrl https://openrouter.ai/api (its own path builder appends /v1/messages),
# and under the pinned completions protocol that inherited base resolves to the
# nonexistent /api/chat/completions — a flat 404 on every turn of that model.
# The pinned base makes every id on the route, listed or bare, post to
# /api/v1/chat/completions.
#
# Subscription plans connect through the same env file: a non-empty
# ZAI_CODING_CN_API_KEY adds the `zai-coding-cn` route, whose key names an
# installed pi-ai catalog provider, so the endpoint
# (https://open.bigmodel.cn/api/coding/paas/v4), the wire protocol, and the
# model catalog (glm-5.3, glm-5.3-flash, glm-5.3-highspeed, glm-4.6v) are all
# inherited and need no restatement. The route is added only when the key is
# set, because an API-key route lists its catalog even without a credential,
# which would show clients models every request of theirs would fail on.
# To wire the international plan instead, rename the env var and the route to
# `zai`/`ZAI_API_KEY` (api.z.ai; a wider catalog). Both expressions below
# compute the whole `providers` dict, so the two routes stay one config value.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers: !!js "(() => {
      const ids = (process.env.NW_MODELS ?? '').split(',').map((id) => id.trim()).filter(Boolean);
      if (ids.length === 0) {
        throw new Error('client-north-waterfront: NW_MODELS is empty - the model allowlist comes only from the'
          + ' launcher env (.env.north-waterfront), so the site was started outside dsh-web-north-waterfront.cmd.'
          + ' Launch through the launcher, or set NW_MODELS with nw-models.cmd id1,id2,...');
      }
      return {
        openrouter: {
          apiKeyEnv: 'OPENROUTER_API_KEY',
          api: 'openai-completions',
          baseURL: 'https://openrouter.ai/api/v1',
          models: ids.map((id) => ({ id })),
        },
        ...((process.env.ZAI_CODING_CN_API_KEY ?? '').trim() === '' ? {} : {
          'zai-coding-cn': { apiKeyEnv: 'ZAI_CODING_CN_API_KEY', displayName: 'Z.AI Coding' },
        }),
      };
    })()"
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: openrouter
    model: !!js "(() => { const ids = (process.env.NW_MODELS ?? '').split(',').map((id) => id.trim()).filter(Boolean); if (ids.length === 0) throw new Error('client-north-waterfront: NW_MODELS is empty - start the site via dsh-web-north-waterfront.cmd or set NW_MODELS with nw-models.cmd'); return ids[0]; })()"

# Only the OpenRouter route above is reachable on the client site: the native
# DeepSeek adapters would add their own unrestricted provider groups to the
# picker (and the API-key route lists its catalog even without a credential).
- id: llm-deepseek
  disabled: true
- id: llm-deepseek-account
  disabled: true

# The client tunnel authority joins the /api Host/Origin trust fence (the
# documented deployment extension of the connection row's expression). The
# same expression carries the NW_MODELS guard: `connection` is a required
# startup entry, so an empty allowlist fails the whole boot. The llm rows'
# own guards name the cause, but their failure alone only degrades the site
# (the boot survives non-required plugin failures and still listens).
- id: connection
  inject: [webStartup]
  config:
    trustedHosts: !!js "(() => {
      const ids = (process.env.NW_MODELS ?? '').split(',').map((id) => id.trim()).filter(Boolean);
      if (ids.length === 0) {
        throw new Error('client-north-waterfront: NW_MODELS is empty - start the site via'
          + ' dsh-web-north-waterfront.cmd, or set NW_MODELS with nw-models.cmd id1,id2,...');
      }
      return ['north-waterfront.dev-bim.com', ...ctx.webStartup.trustedHosts];
    })()"

# -- Access presets: one workspace folder per client user. --------------------
# Same-id override of the base `permission` row's whole config (a patch
# replaces the targeted row's config, so every key is restated). Only
# workspace-write stays in the catalog and new sessions pin it as the
# default, so the composer seat beside "+" and the "+" command popup offer
# no read-only or full-access switch and no confirmation gate is reachable.
- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
    defaultPreset: workspace-write

# -- Projects: client users create named project folders under one base. -----
# Same-id override of the web-app `workspace-controller` row: projectBase
# anchors the first-use default Workspace and switches on the New project
# button (the follow baseline carries the field). NW_PROJECTS_DIR comes from
# .env.north-waterfront through the launcher; the default matches the folder
# the launcher prepares. Mutually exclusive with documentsDirectory, which is
# never set on this deployment.
- id: workspace-controller
  config:
    projectBase: !!js process.env.NW_PROJECTS_DIR ?? (process.env.USERPROFILE ?? process.env.HOME) + '/north-waterfront'

# Same-id override of the base `ui-conversation` row's whole config (a patch
# replaces the targeted row's config, so every key is restated; the base row
# declares none). Document upload limits for the public client site: 25 MiB
# per file, 50 000 characters of extracted text per document.
- id: ui-conversation
  config:
    maxFileBytes: 26214400
    maxExtractChars: 50000

# Spill is the model's internal recovery cache, not a delivery path: keep it
# under this deployment's DSH_HOME (the launcher pins
# %USERPROFILE%\.dsh-north-waterfront), never in %TEMP%. Same-id override of
# the base `spill-local` row; the 30-day cleanup default stands.
- id: spill-local
  config:
    root: !!js dshHomePath('spill')

# -- Client UI surface: chat and the Чертежи window only. --------------------
# The settings SHELL (`ui-settings`) stays enabled: it provides the
# configForms and settingsSchema services that locale and the whole client
# tree depend on (disabling it collapsed the web boot). It renders nothing
# on its own — every settings section row below is disabled, and the gear
# launcher and Ctrl+, trigger belong to ui-settings-account/general, so no
# settings surface is reachable.
- id: ui-settings-general
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-session-log
  disabled: true
# ui-agent-preset stays enabled: its chip is the client's agent-preset choice
# and the entry into the custom-agent builder below. The picker action slot
# only carries the manager entry; the settings section is unreachable here.
- id: subagent-model-selection-settings
  disabled: true
# The quota/account notice needs the accountUi service from the disabled
# ui-settings-account row.
- id: ui-account-notifications
  disabled: true
- id: ui-plugin-manager
  disabled: true
# ui-model-selection stays enabled: the picker surfaces the restricted
# OpenRouter catalog above. ui-settings-models stays disabled, so the client
# cannot add routes or widen the allowlist.
- id: ui-schedule
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-agent-team
  disabled: true
- id: ui-subagent
  disabled: true
- id: entry-customization
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: ui-sidebar-files
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-cordis
  disabled: true
- id: harness-dev-context
  disabled: true
# Client-side workspace file surfaces: the preset below drops the agent's fs
# tools, so the panels and pickers would be dead doors into the serving
# machine's workspace. The `workspace-files` and `file-upload` HOST services
# stay enabled: session-controller waits on them, and disabling either left
# the whole chat inactive.
- id: directory-picker
  disabled: true
# ui-file-actions stays enabled: its file context menus (Download, Copy path)
# are pure UI over the workspace-files read service the client already has, so
# the client can save presented reports (a PDF card has no intrinsic download
# button). It adds no file listing and no fs tools.
# ui-attachment is enabled: the composer "+" menu's add-file row is the client
# upload path. Documents (PDF/DOCX/XLS(X)/TXT/MD/CSV) extract their text in
# the browser at pick time, and the text rides in the user message next to the
# file block; other types attach verbatim. `ui-file-drag` stays enabled for
# the document-preview panel's drag service.

# -- Agent tool surface: drawings only. ---------------------------------------
# The shipped coding presets (PTC, Minimal, Creator) are not declared on this
# site: the picker shows Standard and the custom agents only, regardless of
# the per-browser Coding Tools preference the overlay cannot pin.
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
# The plugin bundles insert the drawing5/smeta/doc6 MCP rows at the host plane
# by default. Here they are disabled and mounted per-agent instead (in the
# standard preset below and, for custom agents, by the manager's checkbox):
# a per-agent mount is the only way an unchecked plugin row is a hard block —
# the agent never mounts the row, so its mcp__drawing5__* / mcp__smeta__* /
# mcp__doc6__* tools never exist for that agent. A host-plane row would leak
# the tools to every agent and collide with the per-agent serverName.
# The doc6-skill row (the norms skill-catalog entry and the «Нормы» window)
# stays enabled: the presets below drop the skills tool, so agents cannot
# invoke it.
- id: drawing5-mcp
  disabled: true
- id: smeta-mcp
  disabled: true
- id: doc6-mcp
  disabled: true
# Same-id override of the standard preset's whole config (a patch replaces
# the targeted row's config, so every key is restated). Kept: persona,
# instructions context, time context, the compaction group, ask-user, todo,
# read-only file access (`read`, `grep`), the drawing5/smeta MCP rows (now
# per-agent), PDF reports, present.
# Dropped: shell, write/edit, jobs, schedule, skills, goal, plan,
# delegation/subagents, web, office, plugin tools.
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          # `file` in a tool image manifest is a label, not a workspace path:
          # linking it opens an empty preview. The image descriptor carries the
          # real attachment path, which inline image syntax can display.
          prefix: You are the drawings assistant of the north-waterfront client site, powered by the {{model}} model. Work from the drawing5 tools and say plainly when the loaded set has no answer. Tool results may list image labels such as `sheet_039.png`; those are attachment labels, not files in the working directory, so never make them Markdown link destinations. To show an image you have viewed, embed it with Markdown image syntax using the normalized copy path from its image descriptor, and only when the image is essential; otherwise cite the sheet or figure in plain text. Never show cache, temp, or attachment-store paths to the user — user files live only in the project folder, and a file is handed over by creating it in the working directory and calling present. Clients may attach documents through the composer add-file action (PDF, Word, Excel, plain text); each attached document's extracted text arrives in the same message as a "Content of the attached file" block — treat it as client-provided source material and cite the file name when you rely on it. When that block says the text was truncated, say so and ask for the missing part as plain text; you cannot read the original binary attachment with read unless it is plain text. After you assemble a PDF report with the pdf_report tool, publish it with the report_publish tool — quarter, house, and the report file path — so the client finds it in the «Отчёты» panel; ask the client for the quarter and the house when you do not know them.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      # Read-only workspace access: `read` covers workspace files and spilled
      # tool results, `grep` searches them with its `path` confined to the
      # session working directory. Write, edit, and shell stay off. The spill
      # notice points the model at `read`/`grep`, so both exist here.
      - id: tool-fs
        name: '@deepseek-ai/dsh-tool-fs'
        config:
          read: true
          readImage: false
          write: false
          edit: false
          applyPatch: false
      - id: tool-fs-search
        name: '@deepseek-ai/dsh-tool-fs-search'
        config:
          sampleOverCapGlobResults: false
          confineToWorkdir: true
      # Per-agent drawing5/smeta/doc6 MCP mounts (host-plane rows disabled
      # above): same addresses and env as the plugin rows, so
      # .env.north-waterfront keeps driving them. doc6 falls back to the public
      # norms server (the plugin default is a local dev address) and keeps the
      # plugin's longer call timeout: the first corpus query loads the index.
      # Agent-scoped mounts may share the serverName across agents; each
      # session opens its own connection.
      - id: drawing5-mcp
        name: '@deepseek-ai/dsh-mcp-client'
        config:
          serverName: drawing5
          transport: streamable-http
          url: !!js (process.env.DRAWING5_SERVER_URL ?? "https://drawing5.dev-bim.com") + "/mcp"
          headers:
            Authorization: !!js '`Bearer ${process.env.DRAWING5_API_KEY ?? ""}`'
          toolCallTimeoutMs: 120000
      - id: smeta-mcp
        name: '@deepseek-ai/dsh-mcp-client'
        config:
          serverName: smeta
          transport: streamable-http
          url: !!js (process.env.SMETA_SERVER_URL ?? "https://smeta.dev-bim.com") + "/mcp"
          toolCallTimeoutMs: 120000
      - id: doc6-mcp
        name: '@deepseek-ai/dsh-mcp-client'
        config:
          serverName: doc6
          transport: streamable-http
          url: !!js (process.env.DOC6_SERVER_URL ?? "https://doc6-mcp.dev-bim.com") + "/mcp"
          headers:
            Authorization: !!js '`Bearer ${process.env.DOC6_API_KEY ?? ""}`'
          toolCallTimeoutMs: 300000
      # PDF reports without shell or Python: the tool embeds images from the
      # Session's durable attachments (drawing5 sheet results) and writes the
      # file into the client workspace; present shows the delivery card.
      - id: tool-pdf
        name: '@deepseek-ai/dsh-tool-pdf'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'

# -- Custom agents: user-created presets within this deployment's whitelist. --
# The service stores records as data in the site DSH_HOME (json backend) and
# mounts each one into the preset registry as `custom/<slug>`. Every write
# re-validates against this config: a user agent is the site persona prefix
# plus the user's instructions, the fixed base rows copied from the kept
# preset-standard list above (minus persona), and any whitelisted tool rows
# the user checked. The whitelist carries the system tool rows, PDF report
# generation, and the domain MCP rows (host-plane disabled above): a checked
# checkbox mounts the row into
# that agent; an unchecked one is a hard block — the mcp__*__* tools never
# exist for it. Raise allowedTools only with a sandbox review of the added rows.
- insert:
    - id: agent-preset-custom
      name: '@deepseek-ai/dsh-agent-preset-custom'
      config:
        instructionsPrefix: You are the drawings assistant of the north-waterfront client site, powered by the {{model}} model. Work from the drawing5 tools and say plainly when the loaded set has no answer. Tool results may list image labels such as `sheet_039.png`; those are attachment labels, not files in the working directory, so never make them Markdown link destinations. To show an image you have viewed, embed it with Markdown image syntax using the normalized copy path from its image descriptor, and only when the image is essential; otherwise cite the sheet or figure in plain text. In a PDF report, embed the drawing fragments you relied on as image blocks; each call_id is the id of your own get_crop or get_sheet_images tool call, and when that call has scrolled away, request the crop again and pass the fresh call id. Never show cache, temp, or attachment-store paths to the user — user files live only in the project folder, and a file is handed over by creating it in the working directory and calling present. Clients may attach documents through the composer add-file action (PDF, Word, Excel, plain text); each attached document's extracted text arrives in the same message as a "Content of the attached file" block — treat it as client-provided source material and cite the file name when you rely on it. When that block says the text was truncated, say so and ask for the missing part as plain text; you cannot read the original binary attachment with read unless it is plain text. After you assemble a PDF report with the pdf_report tool, publish it with the report_publish tool — quarter, house, and the report file path — so the client finds it in the «Отчёты» panel; ask the client for the quarter and the house when you do not know them.
        basePlugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          # Read-only workspace access for every custom agent: `read` and
          # `grep` cover spilled tool results and workspace files without
          # write, edit, or shell capability; `grep`'s `path` is confined to
          # the session working directory. `read_image` stays off because
          # sheet images arrive as drawing5 attachments.
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
            config:
              read: true
              readImage: false
              write: false
              edit: false
              applyPatch: false
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
              confineToWorkdir: true
          # File delivery for every custom agent: present only declares
          # existing files as turn-tail delivery cards — it creates nothing
          # and reads no contents, so it stays out of the checkbox whitelist.
          # Pair it with a file-producing path (the whitelisted PDF row below;
          # the smeta MCP server can write exports into the workspace).
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
        allowedTools:
          ask-user:
            name: '@deepseek-ai/dsh-tool-ask-user'
            label: Вопросы пользователю
            description: Агент может задать вам вопрос и дождаться ответа. Отметьте, чтобы инструмент был доступен.
          todo:
            name: '@deepseek-ai/dsh-tool-todo'
            label: Задачи
            description: Агент ведёт список задач по текущей работе. Отметьте, чтобы инструмент был доступен.
            config:
              allowParallelInProgress: true
          pdf:
            name: '@deepseek-ai/dsh-tool-pdf'
            label: Отчёт PDF
            description: Агент собирает PDF-отчёт из текста, таблиц и изображений и отдаёт готовый файл после ответа. Отметьте, чтобы инструмент был доступен.
          drawing5:
            name: '@deepseek-ai/dsh-mcp-client'
            label: Чертежи (drawing5)
            description: Инструменты mcp__drawing5__* — проекты, листы, поиск по чертежам. Отметьте, чтобы агент имел доступ; без отметки доступ заблокирован.
            config:
              serverName: drawing5
              transport: streamable-http
              url: !!js (process.env.DRAWING5_SERVER_URL ?? "https://drawing5.dev-bim.com") + "/mcp"
              headers:
                Authorization: !!js '`Bearer ${process.env.DRAWING5_API_KEY ?? ""}`'
              toolCallTimeoutMs: 120000
          smeta:
            name: '@deepseek-ai/dsh-mcp-client'
            label: Сметы (БелЕНиР)
            description: Инструменты mcp__smeta__* — поиск расценок и расчёт позиций. Отметьте, чтобы агент имел доступ; без отметки доступ заблокирован.
            config:
              serverName: smeta
              transport: streamable-http
              url: !!js (process.env.SMETA_SERVER_URL ?? "https://smeta.dev-bim.com") + "/mcp"
              toolCallTimeoutMs: 120000
          doc6:
            name: '@deepseek-ai/dsh-mcp-client'
            label: Нормы (doc6)
            description: Инструменты mcp__doc6__* — поиск по строительным нормам и ТНПА, оглавления и точные пункты. Отметьте, чтобы агент имел доступ; без отметки доступ заблокирован.
            config:
              serverName: doc6
              transport: streamable-http
              url: !!js (process.env.DOC6_SERVER_URL ?? "https://doc6-mcp.dev-bim.com") + "/mcp"
              headers:
                Authorization: !!js '`Bearer ${process.env.DOC6_API_KEY ?? ""}`'
              toolCallTimeoutMs: 300000
        # Оркестраторы: поле включает флаг «оркестратор» в менеджере; сервис
        # подставляет в allowedAgentPresets id выбранных агентом записей.
        # Реестр subagent'ов и spawn-бэкенд уже host-plane (dsh-base), отдельных
        # строк не нужно. У подчинённых этой строки нет — цепочек не возникает.
        delegation:
          name: '@deepseek-ai/dsh-tool-subagent'
          config:
            provider: spawn
            toolName: subagent
          # Общие инструменты управления детьми: список, ожидание, сообщения
          # и прерывание зависших субагентов (list_agents, wait_agent,
          # send_message, interrupt_agent).
          control:
            name: '@deepseek-ai/dsh-tool-subagent-control'
            config:
              interrupt: true
          # Подводка перед ростером делегатов, который сервис добавляет в
          # промпт оркестратора: модель видит id/имя/описание каждого агента
          # и знает, что agent_preset передавать обязательно.
          rosterTemplate: >-
            Твои агенты для запуска через инструмент subagent (всегда передавай
            agent_preset, запускай несколько агентов одним сообщением, в prompt
            передавай конкретную задачу и требование структурированного отчёта):
    - id: ui-custom-agents
      name: '@deepseek-ai/dsh-client-ui-custom-agents'
