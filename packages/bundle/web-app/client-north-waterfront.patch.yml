# Client-facing deployment overlay for north-waterfront.dev-bim.com: the
# customer site for the "Северный берег" drawings delivery. Keeps the NW
# (north-waterfront) brand and password gate, hides every team-facing surface
# (settings, plugin manager, model picker, terminal/files panels,
# agent-orchestration UI), and narrows the agent's tool set to the drawing5
# tools. The permission catalog keeps only workspace-write and pins it as the
# new-session default, so the client user works inside their own workspace
# folder with no access switch.
# The preset-picker chip returns with the custom-agent builder: users compose
# their own agents from the whitelist below (persona instructions + optional
# whitelisted rows). User input reaches the Loader only as typed
# configuration values; the shipped coding presets are not declared here at
# all, and no plugin manager or settings surface is reachable.
# Session state, stored credentials, and settings live in the launcher's
# separate DSH_HOME, not in anything this layer touches.
# Launch: dsh-web-north-waterfront.cmd
#   (dsh web --port 3081 --patch packages/bundle/web-app/client-north-waterfront.patch.yml)

- id: ui-brand-official
  disabled: true

- insert:
    # north-waterfront occupants for the sidebar brand row and the blank-session hero.
    - id: ui-brand-north-waterfront
      name: '@deepseek-ai/dsh-client-ui-brand-north-waterfront'

    # Password gate: DEVBIM_WEB_PASSWORD comes from .env.north-waterfront
    # loaded by the client launcher, so the internal and client sites keep
    # different passwords. An empty value registers no routes, leaving the
    # process-token flow the only entry.
    - id: devbim-auth
      name: '@deepseek-ai/dsh-host-devbim-auth'
      config:
        password: !!js process.env.DEVBIM_WEB_PASSWORD ?? ''
        entryTitle: 'NW — вход'
        wordmarkLead: 'NW'
        wordmarkAccent: ''
        # The served index <title> (the tab title): rewritten per request by
        # the gate, because the shared built bundle keeps its bake-time title.
        indexTitle: 'NW — Северный берег'

# The client DSH_HOME stages fresh with no stored credentials: the model
# provider key comes from the launcher env (.env.north-waterfront) and the
# default model is pinned here, so no sign-in onboarding ever appears.
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      openrouter:
        apiKeyEnv: OPENROUTER_API_KEY
- id: agent-default-model
  name: '@deepseek-ai/dsh-agent-default-model'
  config:
    provider: openrouter
    model: deepseek/deepseek-v4.1-flash

# The client tunnel authority joins the /api Host/Origin trust fence (the
# documented deployment extension of the connection row's expression).
- id: connection
  inject: [webStartup]
  config:
    trustedHosts: !!js "['north-waterfront.dev-bim.com', ...ctx.webStartup.trustedHosts]"

# -- Access presets: one workspace folder per client user. --------------------
# Same-id override of the base `permission` row's whole config (a patch
# replaces the targeted row's config, so every key is restated). Only
# workspace-write stays in the catalog and new sessions pin it as the
# default, so the composer seat beside "+" and the "+" command popup offer
# no read-only or full-access switch and no confirmation gate is reachable.
- id: permission
  config:
    presets:
      workspace-write:
        sandbox: workspace-write
        approval: ask
    defaultPreset: workspace-write

# -- Client UI surface: chat and the Чертежи window only. --------------------
# The settings SHELL (`ui-settings`) stays enabled: it provides the
# configForms and settingsSchema services that locale and the whole client
# tree depend on (disabling it collapsed the web boot). It renders nothing
# on its own — every settings section row below is disabled, and the gear
# launcher and Ctrl+, trigger belong to ui-settings-account/general, so no
# settings surface is reachable.
- id: ui-settings-general
  disabled: true
- id: ui-settings-account
  disabled: true
- id: ui-settings-models
  disabled: true
- id: ui-settings-plugins
  disabled: true
- id: ui-settings-plugin-inventory
  disabled: true
- id: ui-settings-session-log
  disabled: true
# ui-agent-preset stays enabled: its chip is the client's agent-preset choice
# and the entry into the custom-agent builder below. The picker action slot
# only carries the manager entry; the settings section is unreachable here.
- id: subagent-model-selection-settings
  disabled: true
# The quota/account notice needs the accountUi service from the disabled
# ui-settings-account row.
- id: ui-account-notifications
  disabled: true
- id: ui-plugin-manager
  disabled: true
- id: ui-model-selection
  disabled: true
- id: ui-schedule
  disabled: true
- id: ui-jobs
  disabled: true
- id: ui-goal
  disabled: true
- id: ui-plan
  disabled: true
- id: ui-agent-team
  disabled: true
- id: ui-subagent
  disabled: true
- id: entry-customization
  disabled: true
- id: ui-sidebar-terminal
  disabled: true
- id: ui-sidebar-files
  disabled: true
- id: open-in-app
  disabled: true
- id: ui-open-in-app
  disabled: true
- id: ui-trajectory
  disabled: true
- id: ui-cordis
  disabled: true
- id: harness-dev-context
  disabled: true
# Client-side workspace file surfaces: the preset below drops the agent's fs
# tools, so the panels and pickers would be dead doors into the serving
# machine's workspace. The `workspace-files` and `file-upload` HOST services
# stay enabled: session-controller waits on them, and disabling either left
# the whole chat inactive.
- id: directory-picker
  disabled: true
# ui-file-actions stays enabled: its file context menus (Download, Copy path)
# are pure UI over the workspace-files read service the client already has, so
# the client can save presented reports (a PDF card has no intrinsic download
# button). It adds no file listing and no fs tools.
# Chat attachments are dead weight without fs tools, and drawing uploads go
# through the Чертежи window; `ui-file-drag` stays enabled because the
# document-preview panel waits on its service.
- id: ui-attachment
  disabled: true

# -- Agent tool surface: drawings only. ---------------------------------------
# The shipped coding presets (PTC, Minimal, Creator) are not declared on this
# site: the picker shows Standard and the custom agents only, regardless of
# the per-browser Coding Tools preference the overlay cannot pin.
- id: preset-ptc
  disabled: true
- id: preset-minimal
  disabled: true
- id: preset-cordis
  disabled: true
# Same-id override of the standard preset's whole config (a patch replaces
# the targeted row's config, so every key is restated). Kept: persona,
# instructions context, time context, the compaction group, ask-user, todo.
# The drawing5 MCP rows are host-plane and stay available without a preset.
# Dropped: shell, filesystem, search, jobs, schedule, skills, goal, plan,
# delegation/subagents, web, present, office, plugin tools.
- id: preset-standard
  config:
    id: standard
    order: 1
    plugins:
      - id: persona
        name: '@deepseek-ai/dsh-persona'
        config:
          prefix: You are the drawings assistant of the north-waterfront client site, powered by the {{model}} model. Work from the drawing5 tools and say plainly when the loaded set has no answer.
      - id: agent-instructions
        name: '@deepseek-ai/dsh-agent-instructions'
        config:
          maxBytes: 65536
      - id: time-context
        name: '@deepseek-ai/dsh-time-context'
      - id: compaction
        name: cordis:group
        group: true
        isolate:
          compaction: true
          toolResultPruner: true
        config:
          - id: compaction-basic
            name: '@deepseek-ai/dsh-compaction-basic'
          - id: command-compact
            name: '@deepseek-ai/dsh-command-compact'
          - id: tool-result-pruner
            name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
            config:
              thresholdChars: 8192
              headChars: 4096
              tailChars: 1024
      - id: tool-ask-user
        name: '@deepseek-ai/dsh-tool-ask-user'
      - id: tool-todo
        name: '@deepseek-ai/dsh-tool-todo'
        config:
          allowParallelInProgress: true
      # PDF reports without shell or Python: the tool embeds images from the
      # Session's durable attachments (drawing5 sheet results) and writes the
      # file into the client workspace; present shows the delivery card.
      - id: tool-pdf
        name: '@deepseek-ai/dsh-tool-pdf'
      - id: present
        name: '@deepseek-ai/dsh-tool-present'

# -- Custom agents: user-created presets within this deployment's whitelist. --
# The service stores records as data in the site DSH_HOME (json backend) and
# mounts each one into the preset registry as `custom/<slug>`. Every write
# re-validates against this config: a user agent is the site persona prefix
# plus the user's instructions, the fixed base rows copied from the kept
# preset-standard list above (minus persona), and any whitelisted tool rows
# the user selected. Raise allowedTools only with a sandbox review of the
# added rows.
- insert:
    - id: agent-preset-custom
      name: '@deepseek-ai/dsh-agent-preset-custom'
      config:
        instructionsPrefix: You are the drawings assistant of the north-waterfront client site, powered by the {{model}} model. Work from the drawing5 tools and say plainly when the loaded set has no answer.
        basePlugins:
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
        allowedTools:
          ask-user:
            name: '@deepseek-ai/dsh-tool-ask-user'
            label: Вопросы пользователю
          todo:
            name: '@deepseek-ai/dsh-tool-todo'
            label: Задачи
            config:
              allowParallelInProgress: true
    - id: ui-custom-agents
      name: '@deepseek-ai/dsh-client-ui-custom-agents'
