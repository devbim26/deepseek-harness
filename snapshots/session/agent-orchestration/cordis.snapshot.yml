# Replay composition. Recorded parent, worker, and evaluator streams supply the model.
- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek-api-key'
  disabled: true

# The recorded request header carries no shell tool, so the replay mounts none.
- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

# The recorded request header carries no web search tool, so the replay mounts
# none either.
- id: tool-web
  config:
    search: false

- id: plugin-package-inventory-deepseek
  disabled: true

- id: session-title-llm
  disabled: true

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    compression: none

- id: sandbox
  name: '@deepseek-ai/dsh-sandbox-local'
  config:
    runnerCommand:
      - bash
      - -c
      - while [ "$1" != "--" ]; do shift; done; shift; exec "$@"
      - passthrough-runner
    runnerFailureSignatures:
      - 'passthrough-runner: profile rejected'

- insert:
    - id: llm-replay
      name: '@deepseek-ai/dsh-llm-replay'
      config:
        providers:
          - id: openrouter
            name: OpenRouter
            models:
              # The recorded route published this context capacity, so the
              # replay must publish the same one.
              - id: deepseek/deepseek-v4-pro
                contextWindow: 1024000

    - id: agent-preset-registry
      name: '@deepseek-ai/dsh-agent-preset-registry'
      config:
        default: orchestrator

    - id: preset-orchestrator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: orchestrator
        name: Orchestrator
        description: Coordinates the reviewer.
        plugins: []

    - id: preset-reviewer
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: reviewer
        name: Reviewer
        description: Reviews evidence.
        plugins: []

    - id: agent-orchestrator
      name: '@deepseek-ai/dsh-agent-orchestrator'
      config:
        provider: spawn
        maxHandoffChars: 65536
        maxSettledRuns: 4
        reportDirectory: reports

    - id: tool-agent-orchestrator
      name: '@deepseek-ai/dsh-tool-agent-orchestrator'
      config:
        delegates:
          - id: reviewer
            name: Reviewer
            description: Checks facts and missing evidence.
        maxIterations: 2
        maxParallel: 1
        autoReport: false
